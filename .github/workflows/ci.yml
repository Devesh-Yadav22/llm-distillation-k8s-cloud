name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_bad_model:
        description: 'Set to true to test quality gate failure with untrained model'
        required: false
        default: 'false'

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff

      - name: Run Ruff Linter
        run: |
          ruff check . --ignore E501

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests (11 test cases)
        run: |
          python -m unittest discover tests

  model-eval-and-gate:
    name: Model Evaluation & Quality Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Model Release Asset
        id: download_asset
        run: |
          mkdir -p models/v1
          # Check if running intentional bad model test or standard evaluation
          if [ "${{ github.event.inputs.test_bad_model }}" = "true" ]; then
            echo "Running quality gate failure test with untrained model predictions..."
            cp results/untrained_raw.jsonl predictions.jsonl
          else
            echo "Attempting download of release asset or using student predictions..."
            if [ -f results/student_raw.jsonl ]; then
              cp results/student_raw.jsonl predictions.jsonl
            else
              # Download from GitHub release assets via gh cli
              gh release download v1.0 --pattern "model_v1.tar.gz" --dir models/v1/ || true
            fi
          fi

      - name: Evaluate Model on Validation Set
        run: |
          python tools/score.py predictions.jsonl data/validation.jsonl --out results/ci_report.json

      - name: Quality Gate (Minimum 95% JSON Validity)
        run: |
          python tools/score.py predictions.jsonl data/validation.jsonl --min-validity 95

