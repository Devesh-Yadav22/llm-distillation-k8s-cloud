# k8s/secrets.yaml: Credentials for S3 / SeaweedFS storage in namespace 'app'
apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: app
type: Opaque
stringData:
  aws-access-key-id: "seaweedfs-access-key"
  aws-secret-access-key: "seaweedfs-secret-key"

