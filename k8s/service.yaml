# k8s/service.yaml: ClusterIP Service exposing inference pods
apiVersion: v1
kind: Service
metadata:
  name: command-parser
  namespace: app
  labels:
    app: command-parser
spec:
  type: ClusterIP
  selector:
    app: command-parser
  ports:
    - name: http
      port: 8000
      targetPort: 8000

